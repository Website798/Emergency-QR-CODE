<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency QR Generator</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="container">
  <h1>Emergency QR Generator</h1>

  <div class="section">
    <h2>Personal Information</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="birthday" placeholder="Birthday / Age">
    <input type="text" id="address" placeholder="Address">
    <input type="text" id="contact" placeholder="Contact Number">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="socmed" placeholder="Social Media">
    <input type="text" id="school" placeholder="Company/School ID">
    <input type="text" id="religion" placeholder="Religion">

    <label>
      Organ Donor
      <select id="donor">
        <option>No</option>
        <option>Yes</option>
      </select>
    </label>
  </div>

  <div class="section">
    <h2>Medical Information</h2>

    <input type="text" id="blood" placeholder="Blood Type">
    <textarea id="allergies" placeholder="Allergies"></textarea>
    <textarea id="conditions" placeholder="Medical Conditions"></textarea>
    <textarea id="medications" placeholder="Current Medications"></textarea>
    <textarea id="doctor" placeholder="Doctor / Hospital"></textarea>
    <textarea id="insurance" placeholder="PhilHealth / HMO / Insurance"></textarea>
    <textarea id="instructions" placeholder="Special Instructions"></textarea>
  </div>

  <div class="section">
    <h2>Emergency Contacts</h2>

    <div id="contactsContainer"></div>

    <button onclick="addContact()">Add Contact</button>
  </div>

  <div class="buttons">
    <button onclick="generateQR()">Generate QR</button>
    <button onclick="downloadQR()">Download QR</button>
    <button onclick="clearForm()">Clear</button>
  </div>

  <div id="qrcode"></div>

  <textarea id="output" readonly></textarea>
</div>

<script src="script.js"></script>
</body>
